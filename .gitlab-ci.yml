stages:
  - test
  - benchmark

test_full:
  stage: test
  image: gcc:latest
  before_script:
    - apt-get update && apt-get install -y make g++ wget
  script:
    - make clean
    - make
    - make test_full

speedtest:
  stage: benchmark
  image: gcc:latest
  needs:
    - job: test_full
      artifacts: false
  before_script:
    - apt-get update && apt-get install -y make g++ wget git
  allow_failure: true
  script:
    - |
      extract_metrics() { awk '/^Average:/ {for(i=2;i<=NF;i++) if($i ~ /^[0-9.e+]+$/) print $i;}' "$1" | head -n 6; }
      ratio() { awk -v a="$1" -v b="$2" 'BEGIN {if(b>0) printf "%.2f", a/b}'; }
      print_block() {
        printf "%-18s dense-tri=%s dense-edge=%s sparse-tri=%s sparse-edge=%s pcom-parse=%s pcom-write=%s\n" \
          "$1" "$2" "$3" "$4" "$5" "$6" "$7";
      }

      if [ "$CI_PIPELINE_SOURCE" = "merge_request_event" ]; then
        make clean && make && make benchmark | tee curr.txt
        mapfile -t CURR < <(extract_metrics curr.txt)
        git fetch origin "$CI_MERGE_REQUEST_TARGET_BRANCH_NAME"
        git checkout "origin/$CI_MERGE_REQUEST_TARGET_BRANCH_NAME"
        make clean && make && make benchmark | tee base.txt
        mapfile -t BASE < <(extract_metrics base.txt)
        print_block "current vs base" "${CURR[@]}" "${BASE[@]}"
        FAIL=0
        for idx in 0 1 2 3 4 5; do
          OK=$(awk -v c="${CURR[$idx]}" -v b="${BASE[$idx]}" 'BEGIN {print (c>=0.9*b)?1:0}')
          if [ "$OK" != "1" ]; then
            printf "✗ Metric %d regression: %s vs %s (%.2fx)\n" $idx "${CURR[$idx]}" "${BASE[$idx]}" "$(ratio "${CURR[$idx]}" "${BASE[$idx]}")"
            FAIL=1
          fi
        done
        [ "$FAIL" -eq 0 ] && { echo "✓ All benchmarks passed"; exit 0; } || exit 1
      else
        BRANCH=$(git rev-parse --abbrev-ref HEAD)
        make clean && make && make benchmark | tee curr.txt
        mapfile -t CURR < <(extract_metrics curr.txt)
        git fetch origin && git checkout HEAD^
        make clean && make && make benchmark | tee prev.txt
        mapfile -t PREV < <(extract_metrics prev.txt)
        echo "=== vs Previous ==="
        for idx in 0 1 2 3 4 5; do
          printf "metric[%d]: %s vs %s (%sx)\n" $idx "${CURR[$idx]}" "${PREV[$idx]}" "$(ratio "${CURR[$idx]}" "${PREV[$idx]}")"
        done

        if [ "$BRANCH" != "master" ]; then
          git checkout origin/master
          make clean && make && make benchmark | tee master.txt
          mapfile -t MASTER < <(extract_metrics master.txt)
          echo ""
          echo "=== vs Master ==="
          for idx in 0 1 2 3 4 5; do
            printf "metric[%d]: %s vs %s (%sx)\n" $idx "${CURR[$idx]}" "${MASTER[$idx]}" "$(ratio "${CURR[$idx]}" "${MASTER[$idx]}")"
          done
        fi
        exit 0
      fi
