stages:
  - test

test_full:
  stage: test
  image: gcc:latest
  before_script:
    - apt-get update && apt-get install -y make g++ wget
  script:
    - make clean
    - make
    - make test_full

speedtest:
  stage: test
  image: gcc:latest
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - when: always
  before_script:
    - apt-get update && apt-get install -y make g++ wget git
  script:
    - |
      if [ "$CI_PIPELINE_SOURCE" = "merge_request_event" ]; then
        MR_BRANCH="$CI_COMMIT_REF_NAME"
        make clean && make && make benchmark | tee mr_benchmark.txt
        MR_RESULT=$(awk '/^Average:/ {for(i=2;i<=NF;i++) if($i ~ /^[0-9.]+$/) {print $i; exit}}' mr_benchmark.txt)
        git fetch origin master
        git checkout origin/master
        make clean && make && make benchmark | tee master_benchmark.txt
        MASTER_RESULT=$(awk '/^Average:/ {for(i=2;i<=NF;i++) if($i ~ /^[0-9.]+$/) {print $i; exit}}' master_benchmark.txt)
        # Compare results (higher is better)
        echo "MR: $MR_RESULT, master: $MASTER_RESULT"
        awk -v mr="$MR_RESULT" -v master="$MASTER_RESULT" 'BEGIN { if (mr > master) exit 0; else exit 1 }'
      else
        make clean && make && make benchmark | tee current_benchmark.txt
        CURRENT_RESULT=$(awk '/^Average:/ {for(i=2;i<=NF;i++) if($i ~ /^[0-9.]+$/) {print $i; exit}}' current_benchmark.txt)
        git fetch origin
        PREV_COMMIT=$(git rev-parse HEAD^)
        git checkout $PREV_COMMIT
        make clean && make && make benchmark | tee prev_benchmark.txt
        PREV_RESULT=$(awk '/^Average:/ {for(i=2;i<=NF;i++) if($i ~ /^[0-9.]+$/) {print $i; exit}}' prev_benchmark.txt)
        echo "Current: $CURRENT_RESULT, Previous: $PREV_RESULT"
        awk -v curr="$CURRENT_RESULT" -v prev="$PREV_RESULT" 'BEGIN { if (curr > prev) exit 0; else exit 0 }'
      fi
