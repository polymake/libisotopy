stages:
  - test

test:
  stage: test
  image: gcc:latest
  before_script:
    - apt-get update && apt-get install -y make g++ 
  script:
    - make clean
    - make CFLAGS="--coverage" CXXFLAGS="--coverage" LDFLAGS="--coverage"
    - make test
    - gcovr --print-summary
  coverage: /^TOTAL.*\s+(\d+\%)$/
