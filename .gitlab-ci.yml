stages:
  - test

test_full:
  stage: test
  image: gcc:latest
  before_script:
    - apt-get update && apt-get install -y make g++ wget
  script:
    - make clean
    - make
    - make test_full

speedtest:
  stage: test
  image: gcc:latest
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - when: always
  before_script:
    - apt-get update && apt-get install -y make g++ wget git
  script:
    - |
      if [ "$CI_PIPELINE_SOURCE" = "merge_request_event" ]; then
        MR_BRANCH="$CI_COMMIT_REF_NAME"
        make clean && make && make benchmark | tee mr_benchmark.txt
        MR_RESULT=$(awk '/^Average:/ {for(i=2;i<=NF;i++) if($i ~ /^[0-9.]+$/) {print $i; exit}}' mr_benchmark.txt)
        git fetch origin master
        git checkout origin/master
        make clean && make && make benchmark | tee master_benchmark.txt
        MASTER_RESULT=$(awk '/^Average:/ {for(i=2;i<=NF;i++) if($i ~ /^[0-9.]+$/) {print $i; exit}}' master_benchmark.txt)
        # Compare results (higher is better)
        echo "MR: $MR_RESULT, master: $MASTER_RESULT"
        awk -v mr="$MR_RESULT" -v master="$MASTER_RESULT" 'BEGIN { if (mr > master) exit 0; else exit 1 }'
      else
        # Manual run: compare branch to itself
        make clean && make && make benchmark | tee run1.txt
        RESULT1=$(awk '/^Average:/ {for(i=2;i<=NF;i++) if($i ~ /^[0-9.]+$/) {print $i; exit}}' run1.txt)
        make clean && make && make benchmark | tee run2.txt
        RESULT2=$(awk '/^Average:/ {for(i=2;i<=NF;i++) if($i ~ /^[0-9.]+$/) {print $i; exit}}' run2.txt)
        echo "Run1: $RESULT1, Run2: $RESULT2"
        awk -v r1="$RESULT1" -v r2="$RESULT2" 'BEGIN { if (r1 > r2) exit 0; else exit 0 }'
      fi
