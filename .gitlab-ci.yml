stages:
  - test
  - benchmark

test_full:
  stage: test
  image: gcc:latest
  before_script:
    - apt-get update && apt-get install -y make g++ wget
  script:
    - make clean
    - make
    - make test_full

speedtest:
  stage: benchmark
  image: gcc:latest
  needs:
    - job: test_full
      artifacts: false
  before_script:
    - apt-get update && apt-get install -y make g++ wget git
  allow_failure: true
  script:
    - |
      parse() { awk '/^Average:/ {for(i=2;i<=NF;i++) if($i ~ /^[0-9.]+$/) {print $i; exit}}' "$1"; }
      parse2() { awk '/^Average:/ {count++; if(count==2) {for(i=2;i<=NF;i++) if($i ~ /^[0-9.]+$/) {print $i; exit}}}' "$1"; }
      ratio() { awk -v a="$1" -v b="$2" 'BEGIN {if(b>0) printf "%.2f", a/b}'; }

      if [ "$CI_PIPELINE_SOURCE" = "merge_request_event" ]; then
        make clean && make && make benchmark | tee curr.txt
        CURR_TRI=$(parse curr.txt); CURR_EDGE=$(parse2 curr.txt)

        git fetch origin $CI_MERGE_REQUEST_TARGET_BRANCH_NAME
        git checkout origin/$CI_MERGE_REQUEST_TARGET_BRANCH_NAME
        make clean && make && make benchmark | tee base.txt
        BASE_TRI=$(parse base.txt); BASE_EDGE=$(parse2 base.txt)

        echo "Triangles: $CURR_TRI vs $BASE_TRI ($(ratio $CURR_TRI $BASE_TRI)x)"
        echo "Edges: $CURR_EDGE vs $BASE_EDGE ($(ratio $CURR_EDGE $BASE_EDGE)x)"

        TRI_OK=$(awk -v c="$CURR_TRI" -v b="$BASE_TRI" 'BEGIN {print (c>=0.9*b)?1:0}')
        EDGE_OK=$(awk -v c="$CURR_EDGE" -v b="$BASE_EDGE" 'BEGIN {print (c>=0.9*b)?1:0}')

        if [ "$TRI_OK" = "1" ] && [ "$EDGE_OK" = "1" ]; then
          echo "✓ Both benchmarks passed"; exit 0
        else
          [ "$TRI_OK" = "0" ] && echo "✗ Triangle: $CURR_TRI < 90% of $BASE_TRI"
          [ "$EDGE_OK" = "0" ] && echo "✗ Edge: $CURR_EDGE < 90% of $BASE_EDGE"
          exit 1
        fi
      else
        BRANCH=$(git rev-parse --abbrev-ref HEAD)
        make clean && make && make benchmark | tee curr.txt
        CURR_TRI=$(parse curr.txt); CURR_EDGE=$(parse2 curr.txt)

        git fetch origin && git checkout HEAD^
        make clean && make && make benchmark | tee prev.txt
        PREV_TRI=$(parse prev.txt); PREV_EDGE=$(parse2 prev.txt)

        echo "=== vs Previous ==="
        echo "Triangles: $CURR_TRI vs $PREV_TRI ($(ratio $CURR_TRI $PREV_TRI)x)"
        echo "Edges: $CURR_EDGE vs $PREV_EDGE ($(ratio $CURR_EDGE $PREV_EDGE)x)"

        if [ "$BRANCH" != "master" ]; then
          git checkout origin/master
          make clean && make && make benchmark | tee master.txt
          MASTER_TRI=$(parse master.txt); MASTER_EDGE=$(parse2 master.txt)
          echo ""
          echo "=== vs Master ==="
          echo "Triangles: $CURR_TRI vs $MASTER_TRI ($(ratio $CURR_TRI $MASTER_TRI)x)"
          echo "Edges: $CURR_EDGE vs $MASTER_EDGE ($(ratio $CURR_EDGE $MASTER_EDGE)x)"
        fi
        exit 0
      fi
